# Home Assistant integration quality scale: https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Status per rule: done | todo | exempt (with comment). Open work is tracked in GitHub issues.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling:
    status: exempt
    comment: cloud_push; entities do not poll (should_poll is False).
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: PyDreo is embedded in pydreo/ instead of a published PyPI package.
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: todo
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done  # issue 2
  test-before-configure: done  # issue 4
  test-before-setup: done
  unique-config-entry: done  # issue 3

  # Silver
  action-exceptions: done  # issue 6; deferred (batched) commands can only log send failures
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: done  # issue 7
  reauthentication-flow: done  # issue 5; token expiry at runtime does not trigger reauth yet
  test-coverage: done  # 91 % of custom_components/dreo

  # Gold
  devices: done  # issue 10
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud account integration, devices are not discoverable on the network.
  discovery:
    status: exempt
    comment: Cloud account integration, devices are not discoverable on the network.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: done  # SUPPORTED_MODELS.md
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: Devices added to the Dreo account after setup need a reload.
  entity-category: done  # issue 8
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: done  # issue 6
  icon-translations:
    status: todo
    comment: icons.json exists, but many entity descriptions still set icon= directly.
  reconfiguration-flow: done  # issue 9
  repair-issues:
    status: todo
    comment: No repair issues raised yet.
  stale-devices: done  # async_remove_config_entry_device

  # Platinum
  async-dependency: todo  # issue 12
  inject-websession: todo  # issue 12
  strict-typing: todo  # issue 12
